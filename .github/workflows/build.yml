name: Build CV

on:
  push:
    branches:
      - main
  # PRs into main only compile both CVs (the "build" job) so a broken LaTeX
  # change is caught before merging. Publishing runs on push to main only.
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Every CV is an independent LaTeX build with its own main.tex and
      # sections/: the general CV in main/fr and main/en, plus one folder per
      # job offer in adapted-by-offers/<offer>/<lang>. All share the logos in
      # assets/logos/ via relative paths, so each file is compiled from inside
      # its own directory. New offer folders are picked up by the glob — no
      # workflow change needed. See skills/cv-editor/SKILL.md.
      - name: Compile all CVs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            main/*/main.tex
            adapted-by-offers/*/*/main.tex
          work_in_root_file_dir: true

      # main/fr -> CV-CHAOUI-EL-MEHDI-FR.pdf (permanent links, unchanged)
      # adapted-by-offers/alton-narsa-chatbot/fr
      #   -> CV-CHAOUI-EL-MEHDI-FR-ALTON-NARSA-CHATBOT.pdf
      - name: Rename compiled PDFs
        run: |
          mkdir -p out
          for pdf in main/*/main.pdf; do
            lang=$(basename "$(dirname "$pdf")" | tr '[:lower:]' '[:upper:]')
            cp "$pdf" "out/CV-CHAOUI-EL-MEHDI-${lang}.pdf"
          done
          for pdf in adapted-by-offers/*/*/main.pdf; do
            lang=$(basename "$(dirname "$pdf")" | tr '[:lower:]' '[:upper:]')
            offer=$(basename "$(dirname "$(dirname "$pdf")")" | tr '[:lower:]' '[:upper:]')
            cp "$pdf" "out/CV-CHAOUI-EL-MEHDI-${lang}-${offer}.pdf"
          done
          ls -l out

      # Also lets a PR's compiled PDFs be previewed from the run's
      # Artifacts section before merging.
      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: out/*.pdf
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: Download compiled PDFs
        uses: actions/download-artifact@v4
        with:
          name: cv-pdfs
          path: out

      - name: Publish (or update) the "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest CV
          body: |
            Automatically built from commit ${{ github.sha }}.
            Permanent download links:
            - French: `releases/download/latest/CV-CHAOUI-EL-MEHDI-FR.pdf`
            - English: `releases/download/latest/CV-CHAOUI-EL-MEHDI-EN.pdf`
            - Offer-adapted versions: `CV-CHAOUI-EL-MEHDI-<LANG>-<OFFER>.pdf`
            Inline browser preview: published via GitHub Pages.
          artifacts: out/*.pdf
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Pages serves files with Content-Type: application/pdf and no
      # forced download, unlike Release assets — so these URLs open inline
      # in the browser. Requires Pages enabled once in repo Settings > Pages
      # > Build and deployment > Source: GitHub Actions.
      - name: Prepare Pages content
        run: |
          mkdir -p public
          cp out/*.pdf public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
